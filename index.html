<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 12px;
    color: #fff; font-size: 20px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,.45); pointer-events: none;
  }
  #hud .pill { background: rgba(0,0,0,.28); padding: 6px 14px; border-radius: 999px; }
  #hud .pill:empty { display: none; }
  #hud .group { display: flex; gap: 12px; }
  #bossbar {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%); width: min(420px, 70vw);
    color: #fff; text-align: center; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; display: none;
  }
  #bossbar .track { height: 12px; margin-top: 4px; background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.7); border-radius: 8px; overflow: hidden; }
  #bossbar .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #40ffd0, #ff5fd0); transition: width .2s; }
  #banner {
    position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #fff; pointer-events: none;
    text-shadow: 0 3px 10px rgba(0,0,0,.6); opacity: 0; transition: opacity .6s;
  }
  #banner.show { opacity: 1; }
  #banner .big { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
  #banner .small { font-size: 18px; margin-top: 6px; opacity: .9; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 15, 35, .55); color: #fff; text-align: center; cursor: pointer;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: 2px; }
  #overlay p { font-size: 18px; margin: 6px 0; opacity: .9; }
  #overlay .cta { margin-top: 24px; font-size: 22px; font-weight: 700; animation: pulse 1.4s ease-in-out infinite; }
  #overlay kbd { background: rgba(255,255,255,.18); border-radius: 4px; padding: 1px 7px; font-family: inherit; }
  #overlay .levels { display: grid; grid-template-columns: repeat(4, auto); gap: 10px; justify-content: center; margin-top: 18px; }
  #overlay .levels button {
    font: inherit; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); border-radius: 12px; padding: 10px 16px;
  }
  #overlay .levels button:hover { background: rgba(255,255,255,.28); border-color: #fff; }
  @keyframes pulse { 50% { opacity: .45; } }
  #flash { position: fixed; inset: 0; background: #ff3040; opacity: 0; pointer-events: none; transition: opacity .25s; }
</style>

// Renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 50, 140);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);

// Gradient sky dome (colours set per level)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = clamp(vP.y * 1.6 + 0.15, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);

const hemi = new THREE.HemisphereLight();
const sun = new THREE.DirectionalLight();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 80 });
sun.shadow.bias = -0.0005;
scene.add(hemi, sun, sun.target);

// Everything belonging to the current level lives in here and is thrown away on level change
let world = new THREE.Group();
scene.add(world);

const DOT = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,.8)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// Level building
function std(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, ...extra });
}
function shadow(m) { m.castShadow = m.receiveShadow = true; return m; }

function buildPlatform([x, top, z, w, d, opt = {}], i, theme) {
  const h = opt.start ? 3 : 1.6;
  const group = new THREE.Group();

  let topColor = theme.top[i % theme.top.length], rockColor = theme.rock;
  if (opt.move) { topColor = 0xb88cff; rockColor = 0x6a54a8; }
  if (opt.ice) topColor = 0xa8e4ff;
  if (opt.crumble) { topColor = 0xd9822b; rockColor = 0x7a4420; }
  const topMat = std(topColor, {
    emissive: opt.crumble && theme.topEmissive ? 0x401500 : theme.topEmissive ?? 0x000000,
    roughness: opt.ice ? 0.15 : 0.9, metalness: opt.ice ? 0.3 : 0,
  });
  const rockMat = std(rockColor);

  const grass = shadow(new THREE.Mesh(new THREE.BoxGeometry(w, 0.35, d), topMat));
  grass.position.y = -0.175;
  const rock = shadow(new THREE.Mesh(new THREE.BoxGeometry(w * 0.96, h - 0.35, d * 0.96), rockMat));
  rock.position.y = -0.35 - (h - 0.35) / 2;
  group.add(grass, rock);

  // crumbling platforms get visible cracks
  if (opt.crumble) {
    const pts = [];
    for (let k = 0; k < 4; k++) {
      let px = (Math.random() - 0.5) * w * 0.6, pz = (Math.random() - 0.5) * d * 0.6;
      for (let s = 0; s < 3; s++) {
        const nx = THREE.MathUtils.clamp(px + (Math.random() - 0.5) * 1.2, -w / 2, w / 2);
        const nz = THREE.MathUtils.clamp(pz + (Math.random() - 0.5) * 1.2, -d / 2, d / 2);
        pts.push(V(px, 0.01, pz), V(nx, 0.01, nz));
        px = nx; pz = nz;
      }
    }
    group.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x2a1205 })));
  }

  // neon outlines
  if (theme.edges) {
    const col = opt.move ? 0xffffff : opt.crumble ? 0xffa020 : theme.edges[i % theme.edges.length];
    grass.add(new THREE.LineSegments(new THREE.EdgesGeometry(grass.geometry), new THREE.LineBasicMaterial({ color: col })));
    rock.add(new THREE.LineSegments(new THREE.EdgesGeometry(rock.geometry), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.35 })));
  }

  const cone = new THREE.Mesh(new THREE.ConeGeometry(Math.min(w, d) * 0.55, Math.min(w, d) * (opt.start ? 0.9 : 0.7), 6), rockMat);
  cone.rotation.x = Math.PI;
  cone.position.y = -h - cone.geometry.parameters.height / 2 + 0.05;
  cone.castShadow = true;
  group.add(cone);

  let pad = null;
  if (opt.bounce) {
    pad = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w, d) * 0.38, Math.min(w, d) * 0.42, 0.1, 20), std(0xff3fa4, { emissive: 0xa0105a }));
    pad.position.y = 0.05;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.min(w, d) * 0.4, 0.06, 6, 24), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.06;
    pad.add(ring);
    group.add(pad);
  }

  group.position.set(x, top, z);
  world.add(group);

  return {
    group, w, d, h, pad,
    base: V(x, top, z),
    pos: V(x, top, z),
    delta: V(),
    move: opt.move ? V(...opt.move) : null,
    speed: opt.speed || 1,
    ice: !!opt.ice, bounce: !!opt.bounce, crumble: !!opt.crumble,
    solid: true, cState: 'idle', cTimer: 0, fallV: 0,
    obstacles: [],
  };
}

function makeClouds(lv, yMin, yMax, color = 0xffffff, count = 28) {
  const mat = std(color, { transparent: true, opacity: 0.92 });
  for (let i = 0; i < count; i++) {
    const c = new THREE.Group();
    const n = 3 + Math.floor(Math.random() * 4);
    for (let j = 0; j < n; j++) {
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 + Math.random() * 1.5, 0), mat);
      s.position.set(j * 1.8 - n, Math.random() * 0.8, Math.random() * 1.5);
      s.scale.y = 0.6;
      c.add(s);
    }
    const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 60;
    c.position.set(Math.cos(a) * r, yMin + Math.random() * (yMax - yMin), Math.sin(a) * r);
    c.userData.speed = 0.5 + Math.random();
    world.add(c);
    lv.clouds.push(c);
  }
}

function ringPositions(n, minDist, maxDist) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, d = minDist + Math.random() * (maxDist - minDist);
    out.push([Math.cos(a) * d, Math.sin(a) * d]);
  }
  return out;
}

// Ambient particles: snow falls, embers rise, etc. They wrap around the player. Stars sit on the sky.
const AMBIENT = {
  snow:      { n: 1800, color: 0xffffff, size: 0.22, vy: -2.2, vx: 0, sway: 0.6 },
  embers:    { n: 700, color: 0xffa040, size: 0.18, vy: 2.4, vx: 0, sway: 0.6, additive: true },
  fireflies: { n: 350, color: 0xd8ff6a, size: 0.32, vy: 0.2, vx: 0, sway: 1.5, additive: true },
  dust:      { n: 1400, color: 0xe6c690, size: 0.14, vy: -0.3, vx: 7, sway: 0.8 },
  rain:      { n: 2600, color: 0xaac4ff, size: 0.12, vy: -26, vx: -2, sway: 0 },
  motes:     { n: 600, color: 0x6afff0, size: 0.2, vy: 0.8, vx: 0, sway: 0.8, additive: true },
  stars:     { n: 1600, color: 0xffffff, size: 2.2, stars: true, additive: true },
};

function makeAmbient(type) {
  const cfg = AMBIENT[type];
  const box = V(40, 22, 40);
  const arr = new Float32Array(cfg.n * 3);
  for (let i = 0; i < cfg.n; i++) {
    if (cfg.stars) {
      const v = V(Math.random() - 0.5, Math.random() * 0.9 - 0.1, Math.random() - 0.5).normalize().multiplyScalar(250);
      arr.set([v.x, v.y, v.z], i * 3);
    } else {
      arr.set([(Math.random() * 2 - 1) * box.x, (Math.random() * 2 - 1) * box.y, (Math.random() * 2 - 1) * box.z], i * 3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    map: DOT, transparent: true, depthWrite: false, color: cfg.color, size: cfg.size,
    sizeAttenuation: !cfg.stars, fog: !cfg.stars,
    blending: cfg.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  }));
  points.frustumCulled = false;
  world.add(points);
  return { cfg, points, box };
}

function updateAmbient(amb, dt, t) {
  const { cfg, points, box: b } = amb;
  if (cfg.stars) {
    points.position.copy(camera.position);
    points.material.opacity = 0.85 + Math.sin(t * 3) * 0.1;
    return;
  }
  if (cfg === AMBIENT.fireflies) points.material.opacity = 0.6 + Math.sin(t * 2.3) * 0.35;
  const a = points.geometry.attributes.position.array, c = state.pos;
  for (let i = 0; i < a.length; i += 3) {
    const k = 0.7 + (i % 7) * 0.08;
    a[i] += (cfg.vx * k + Math.sin(t * 0.8 + i) * cfg.sway) * dt;
    a[i + 1] += cfg.vy * dt * k;
    a[i + 2] += Math.cos(t * 0.7 + i) * cfg.sway * dt;
    if (a[i] - c.x > b.x) a[i] -= 2 * b.x; else if (a[i] - c.x < -b.x) a[i] += 2 * b.x;
    if (a[i + 1] - c.y > b.y) a[i + 1] -= 2 * b.y; else if (a[i + 1] - c.y < -b.y) a[i + 1] += 2 * b.y;
    if (a[i + 2] - c.z > b.z) a[i + 2] -= 2 * b.z; else if (a[i + 2] - c.z < -b.z) a[i + 2] += 2 * b.z;
  }
  points.geometry.attributes.position.needsUpdate = true;
}

// Creatures
const crystalGeo = new THREE.OctahedronGeometry(0.45, 0);
const enemyGeo = new THREE.IcosahedronGeometry(0.55, 0);
const spikeGeo = new THREE.ConeGeometry(0.16, 0.5, 4);
const spikeDirs = (() => {
  const pos = enemyGeo.attributes.position, seen = new Map();
  for (let k = 0; k < pos.count; k++) {
    const v = V().fromBufferAttribute(pos, k);
    seen.set(v.toArray().map(n => n.toFixed(2)).join(), v);
  }
  return [...seen.values()];
})();

function eye(x, y, z, size = 0.15) {
  const g = new THREE.Group();
  const white = new THREE.Mesh(new THREE.SphereGeometry(size, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(size * 0.5, 8, 6), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  pupil.position.z = size * 0.7;
  g.add(white, pupil);
  g.position.set(x, y, z);
  return g;
}

function faceToward(obj, target) {
  obj.rotation.y = Math.atan2(target.x - obj.position.x, target.z - obj.position.z);
}

// Each creature type: make() builds the mesh and stats, update() moves it every frame
const CREATURES = {
  spiky: {
    color: null, // uses the theme's enemy colour
    make(lv, [axis, range, speed]) {
      const mat = std(lv.theme.enemy[0], { emissive: lv.theme.enemy[1] });
      const g = new THREE.Group();
      const body = new THREE.Mesh(enemyGeo, mat);
      body.castShadow = true;
      g.add(body);
      for (const v of spikeDirs) {
        const spike = new THREE.Mesh(spikeGeo, mat);
        spike.position.copy(v).multiplyScalar(1.1);
        spike.quaternion.setFromUnitVectors(V(0, 1, 0), v.clone().normalize());
        g.add(spike);
      }
      return { mesh: g, axis, range, speed, radius: 0.75, hp: 1 };
    },
    update(c, dt, t) {
      const off = Math.sin(t * c.speed + c.phase) * c.range;
      c.mesh.position.set(
        c.plat.pos.x + (c.axis === 'x' ? off : 0),
        c.plat.pos.y + 0.6 + Math.abs(Math.sin(t * 6 + c.phase)) * 0.15,
        c.plat.pos.z + (c.axis === 'z' ? off : 0)
      );
      c.mesh.rotation.y += dt * 3;
      c.mesh.rotation.x += dt * 1.3;
    },
  },

  hopper: {
    color: 0x6ad04a,
    make(lv, [dx, dz, height, period]) {
      const g = new THREE.Group(), inner = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10), std(0x6ad04a));
      body.scale.set(1, 0.75, 1.1);
      body.castShadow = true;
      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 8), std(0xe6f2a0));

    },
    update(c, dt, t) {
      const u = ((t + c.phase) % c.period) / c.period;

      else { squash = 1 - 0.25 * Math.sin(((u - air) / (1 - air)) * Math.PI); }
      c.mesh.position.set(c.plat.pos.x + c.dx, c.plat.pos.y + 0.42 + h, c.plat.pos.z + c.dz);

  },

  bat: {
    color: 0x7a4a9a,
    make(lv, [dx, dz, leash]) {
      const g = new THREE.Group();
      const furM = std(0x3a2a4a);
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 8), furM);
      body.castShadow = true;
      for (const s of [-1, 1]) {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.25, 4), furM);
        ear.position.set(s * 0.15, 0.35, 0);
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial({ color: 0xff3040 }));
        e.position.set(s * 0.12, 0.08, 0.3);
        g.add(ear, e);
      }
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0.9, 0.25); shape.lineTo(0.75, -0.1); shape.lineTo(0.5, 0.02); shape.lineTo(0.3, -0.15); shape.lineTo(0, 0);
      const wingGeo = new THREE.ShapeGeometry(shape);
      wingGeo.rotateX(-Math.PI / 2);
      const wingM = std(0x5a3a6a, { side: THREE.DoubleSide });
      const wingL = new THREE.Mesh(wingGeo, wingM), wingR = new THREE.Mesh(wingGeo, wingM);
      wingL.position.x = 0.25; wingR.position.x = -0.25; wingR.scale.x = -1;

    },
    update(c, dt, t) {
      const home = V(c.plat.pos.x + c.dx, c.plat.pos.y + 2.2, c.plat.pos.z + c.dz);
      if (!c.p) c.p = home.clone();
      let target = home;
      if (state.mode === 'playing' && state.pos.distanceTo(home) < c.leash + 4) {
        const off = state.pos.clone().add(V(0, 0.3, 0)).sub(home);
        if (off.length() > c.leash) off.setLength(c.leash);
        target = home.clone().add(off);
      }
      const d = target.clone().sub(c.p), len = d.length();
      if (len > 0.01) c.p.addScaledVector(d, Math.min(1, (3.4 * dt) / len));
      c.mesh.position.copy(c.p);
      c.mesh.position.y += Math.sin(t * 3 + c.phase) * 0.25;
      const flap = Math.sin(t * 18 + c.phase) * 0.7;
      c.wingL.rotation.z = flap; c.wingR.rotation.z = -flap;
      faceToward(c.mesh, len > 0.2 ? target : state.pos);
    },
  },

  turret: {
    color: 0x9a3ad0,
    make(lv, [dx, dz]) {
      const g = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, 0.9, 8), std(0x2f7a3a));
      stem.position.y = 0.45;

      }

      head.position.y = 1.05;

      bulb.castShadow = true;
      const mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.3, 12), std(0x1a0a20));

      mouth.position.z = 0.35;

      c.head.scale.setScalar(1 + Math.max(0, 0.4 - c.cd) * 0.5); // swell up before spitting
      if (state.mode !== 'playing') return;
      const from = c.mesh.position.clone().add(V(0, 1.05, 0));
      if (from.distanceTo(state.pos) > 17) return;
      c.cd -= dt;

  orbiter: {
    color: 0xd0d0d8,
    make(lv, [r, speed]) {

  golem: {
    color: 0x40ffd0,
    make(lv, [dx, dz]) {
      const g = new THREE.Group();
      const rock = std(0x4a4560);
      const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1.05, 0), rock);
      body.castShadow = true;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.7, 0.75), rock);
      head.position.set(0, 1.1, 0.15);
      head.castShadow = true;
      for (const s of [-1, 1]) {
        const e = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.1, 0.05), new THREE.MeshBasicMaterial({ color: 0x40ffd0 }));
        e.position.set(s * 0.2, 1.15, 0.54);
        g.add(e);
      }
      const arms = [];
      for (const s of [-1, 1]) {
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.3, 0.45), rock);
        arm.geometry.translate(0, -0.55, 0);
        arm.position.set(s * 1.2, 0.5, 0);
        arm.castShadow = true;
        arms.push(arm);
        g.add(arm);
      }
      for (let k = 0; k < 5; k++) {
        const col = k % 2 ? 0x40ffd0 : 0xff5fd0;
        const sp = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), std(col, { emissive: col, emissiveIntensity: 0.8 }));
        sp.scale.y = 2.2;
        sp.position.set((k - 2) * 0.3, 0.6 + Math.abs(k - 2) * -0.1, -0.75);
        sp.rotation.x = -0.6;
        g.add(sp);
      }
      g.add(body, head);
      return { mesh: g, arms, dx, dz, radius: 1.25, hp: 6, maxHp: 6, cd: 2, p: null, boss: true };
    },
    update(c, dt, t) {
      const pl = c.plat;
      if (!c.p) c.p = V(pl.pos.x + c.dx, 0, pl.pos.z + c.dz);
      const engaged = state.mode === 'playing' && state.pos.y > pl.pos.y - 2 &&
        Math.hypot(state.pos.x - pl.pos.x, state.pos.z - pl.pos.z) < Math.max(pl.w, pl.d) / 2 + 6;
      let walking = false;
      if (engaged) {
        const dx = state.pos.x - c.p.x, dz = state.pos.z - c.p.z, len = Math.hypot(dx, dz);
        if (len > 1.6) {
          c.p.x += (dx / len) * 2.2 * dt; c.p.z += (dz / len) * 2.2 * dt;
          walking = true;
        }
        const mx = pl.w / 2 - 1.3, mz = pl.d / 2 - 1.3;
        c.p.x = THREE.MathUtils.clamp(c.p.x, pl.pos.x - mx, pl.pos.x + mx);
        c.p.z = THREE.MathUtils.clamp(c.p.z, pl.pos.z - mz, pl.pos.z + mz);
        c.cd -= dt;
        if (c.cd <= 0) {
          c.cd = 2.8;
          const from = c.mesh.position.clone().add(V(0, 1.3, 0));
          const dir = state.pos.clone().sub(from).normalize();
          spawnProjectile('enemy', from.addScaledVector(dir, 0.8), dir.multiplyScalar(11), 0x8a7aa0, 0.45);
          beep(90, 0.3, 'sawtooth', 0.12, 0.6);
        }
      }
      const swing = walking ? Math.sin(t * 6) * 0.6 : 0;
      c.arms[0].rotation.x = swing; c.arms[1].rotation.x = -swing;
      c.mesh.position.set(c.p.x, pl.pos.y + 1.1 + (walking ? Math.abs(Math.sin(t * 6)) * 0.1 : 0), c.p.z);
      faceToward(c.mesh, state.pos);
    },
  },
};

function damageCreature(c, amount) {
  if (!c.alive) return;
  c.hp -= amount;
  c.pulse = 0.18;
  if (c.hp > 0) { beep(500, 0.08, 'square', 0.08, 0.7); return; }
  c.alive = false;
  c.mesh.visible = false;
  const col = CREATURES[c.type].color ?? level.theme.enemy[0];
  burst(c.mesh.position, col, c.boss ? 40 : 20, c.boss ? 9 : 6);
  beep(c.boss ? 120 : 260, c.boss ? 0.8 : 0.25, 'triangle', 0.18, 0.3);
  if (c.boss && !level.creatures.some(o => o.boss && o.alive)) unlockBossShards();
}

function unlockBossShards() {
  for (const cr of level.crystals) {
    if (!cr.locked) continue;
    cr.locked = false;
    cr.mesh.visible = true;
    burst(cr.mesh.position, level.theme.crystal[0], 24, 6);
  }
  fanfare();
  showBanner('The golem is down!', 'The last shards are free. Go grab them.', 3000);
}

let level = null;
let worldTime = 0;
let snapCamera = true;

function loadLevel(index) {
  // tear down the old level
  scene.remove(world);
  world.traverse(o => {
    o.geometry?.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
  });
  world = new THREE.Group();
  scene.add(world);
  for (const p of projectiles) { p.active = false; p.mesh.visible = false; }

  const def = LEVELS[index], theme = THEMES[def.theme];
  skyMat.uniforms.top.value.set(theme.skyTop);
  skyMat.uniforms.bottom.value.set(theme.skyBottom);
  scene.fog.color.set(theme.skyBottom);
  [scene.fog.near, scene.fog.far] = theme.fog;
  hemi.color.set(theme.hemi[0]); hemi.groundColor.set(theme.hemi[1]); hemi.intensity = theme.hemi[2];
  sun.color.set(theme.sun[0]); sun.intensity = theme.sun[1];

  const lv = {
    index, def, theme, clouds: [], spinners: [], decor: [], lava: null, ambient: null, lightning: null,
    killY: theme.floorY !== undefined ? theme.floorY + 0.4 : -25,
  };
  level = lv;
  lv.plats = def.plats.map((p, i) => buildPlatform(p, i, theme));

  for (const [pi, dx, dz] of def.decor) {
    const pl = lv.plats[pi];
    const { obj, r, h } = DECOR[theme.decor]();
    obj.position.set(dx, 0, dz);
    obj.rotation.y = Math.random() * Math.PI;
    pl.group.add(obj);
    pl.obstacles.push({ dx, dz, r, h });
    lv.decor.push(obj);
  }

  const crystalMat = std(theme.crystal[0], { emissive: theme.crystal[1], emissiveIntensity: 0.9 });
  lv.crystals = def.crystals.map(([pi, dx, dz, tag]) => {
    const m = new THREE.Mesh(crystalGeo, crystalMat);
    m.scale.y = 1.5;
    m.castShadow = true;
    const locked = tag === 'boss';
    m.visible = !locked;
    world.add(m);
    return { mesh: m, plat: lv.plats[pi], dx, dz, collected: false, locked, phase: Math.random() * 6 };
  });

  lv.creatures = def.enemies.map(e => {
    if (e[1] === 'x' || e[1] === 'z') e = [e[0], 'spiky', ...e.slice(1)]; // short form for spiky
    const [pi, type, ...args] = e;
    const c = CREATURES[type].make(lv, args);
    Object.assign(c, { type, plat: lv.plats[pi], phase: Math.random() * 6, alive: true, pulse: 0 });
    world.add(c.mesh);
    return c;
  });

  lv.items = (def.items || []).map(([pi, dx, dz, kind]) => {
    const g = new THREE.Group();
    const obj = ITEMS[kind].make();
    const beacon = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 6, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
    beacon.rotation.x = Math.PI / 2;
    beacon.position.y = -0.85;
    g.add(obj, beacon);
    world.add(g);
    return { mesh: g, obj, beacon, plat: lv.plats[pi], dx, dz, kind, taken: false, phase: Math.random() * 6 };
  });

  for (const ex of theme.extras) EXTRAS[ex](lv);
  if (theme.ambient) lv.ambient = makeAmbient(theme.ambient);

  // reset the player
  Object.assign(state, {
    level: index, time: 0, lives: 3, collected: 0, invuln: 0, jumps: 0, coyote: 0, jumpBuffer: 0,
    groundPlat: null, onGround: false, yaw: def.yaw, pitch: 0.35,
    blaster: false, ammo: 0, boots: false, shield: false, stomping: false, fireCd: 0,
  });
  state.pos.set(...def.spawn);
  state.vel.set(0, 0, 0);
  state.lastSafe.copy(state.pos);
  player.visible = true;
  worldTime = 0;
  snapCamera = true;
  updateHud();
}

      g.fillStyle = '#ff8a2b'; g.fillRect(0, 0, 256, 128);
      g.fillStyle = '#fff4e0'; g.fillRect(0, 54, 256, 20);
      g.fillRect(60, 0, 16, 128); g.fillRect(188, 0, 16, 128);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })(),
  })
);
player.castShadow = true;

const shieldBubble = new THREE.Mesh(

let shockT = 0;

const state = {
  mode: 'title', // title | playing | paused | clear | won | lost
  level: 0,
  pos: V(),
  vel: V(),
  onGround: false,
  groundPlat: null,
  coyote: 0,
  jumpBuffer: 0,
  jumps: 0,
  lives: 3,
  invuln: 0,

  runTime: 0,   // time from completed levels in this run

// Input
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) state.jumpBuffer = 0.15; }
  if (e.code === 'KeyF' && !e.repeat) fire();
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) startStomp();
  if (e.code === 'KeyP' && state.mode === 'playing') pause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousemove', e => {

});

addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Audio
let actx = null;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.15, slide = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function fanfare() {
  beep(523, 0.15, 'triangle', 0.2);
  setTimeout(() => beep(659, 0.15, 'triangle', 0.2), 150);
  setTimeout(() => beep(784, 0.3, 'triangle', 0.2), 300);
}

// Particles
const particles = [];
{
  const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
    m.visible = false;
    scene.add(m);
    particles.push({ mesh: m, vel: V(), life: 0 });
  }
}
function burst(at, color, n = 18, power = 5) {
  let spawned = 0;
  for (const p of particles) {
    if (p.life > 0) continue;
    p.life = 0.6 + Math.random() * 0.4;
    p.mesh.visible = true;
    p.mesh.position.copy(at);
    p.mesh.material.color.set(color);
    p.vel.set(Math.random() - 0.5, Math.random() * 0.8 + 0.2, Math.random() - 0.5).normalize().multiplyScalar(power * (0.5 + Math.random()));
    if (++spawned >= n) break;
  }
}

// Projectiles (player blaster bolts and creature spit share one pool)
const projectiles = [];
{
  const geo = new THREE.SphereGeometry(1, 10, 8);
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.visible = false;
    scene.add(m);
    projectiles.push({ mesh: m, vel: V(), life: 0, active: false, owner: 'player', r: 0.2 });
  }
}
function spawnProjectile(owner, from, vel, color, r) {
  const p = projectiles.find(q => !q.active);
  if (!p) return;
  Object.assign(p, { owner, r, life: 2.5, active: true });
  p.vel.copy(vel);
  p.mesh.position.copy(from);
  p.mesh.scale.setScalar(r);
  p.mesh.material.color.set(color);
  p.mesh.visible = true;
}
function insideSolid(pos) {
  for (const pl of level.plats) {
    if (!pl.solid) continue;
    if (Math.abs(pos.x - pl.pos.x) < pl.w / 2 && Math.abs(pos.z - pl.pos.z) < pl.d / 2 &&
        pos.y < pl.pos.y && pos.y > pl.pos.y - pl.h) return true;
  }
  return false;
}

function fire() {
  if (state.mode !== 'playing' || !state.blaster || state.fireCd > 0) return;
  state.fireCd = 0.22;
  if (state.ammo <= 0) { beep(120, 0.08, 'square', 0.05); return; }
  state.ammo--;
  const origin = state.pos.clone().add(V(0, 0.25, 0));
  const look = state.pos.clone().sub(camera.position).setY(0).normalize();
  let dir = look.clone(), bestD = 30;
  // aim assist: lock on to the nearest creature roughly in front of you
  for (const c of level.creatures) {
    if (!c.alive) continue;
    const target = c.mesh.position.clone().add(V(0, c.centerY ?? 0, 0));
    const v = target.sub(origin), d = v.length();
    if (d > bestD) continue;
    if (V(v.x, 0, v.z).normalize().dot(look) > 0.9) { dir = v.normalize(); bestD = d; }
  }
  spawnProjectile('player', origin.addScaledVector(dir, 0.6), dir.multiplyScalar(32), 0x7ffcff, 0.18);
  beep(900, 0.1, 'sawtooth', 0.06, 0.4);
  updateHud();
}

function startStomp() {
  if (state.mode !== 'playing' || !state.boots || state.onGround || state.stomping) return;
  state.stomping = true;
  state.vel.set(state.vel.x * 0.2, -26, state.vel.z * 0.2);
  beep(300, 0.15, 'square', 0.08, 0.5);
}

function shockwave(at) {
  shockRing.position.set(at.x, at.y - R + 0.06, at.z);
  shockRing.visible = true;
  shockT = 0.35;
  for (const c of level.creatures) {
    if (!c.alive) continue;
    const p = c.mesh.position;
    if (Math.hypot(p.x - at.x, p.z - at.z) < 3.2 + c.radius && p.y - at.y < 2.5 && p.y - at.y > -1.5) damageCreature(c, 2);
  }
  burst(at.clone().setY(at.y - R), 0xffffff, 16, 6);
  beep(90, 0.3, 'sawtooth', 0.18, 0.5);
}

function hurt(knockFrom, { fall = false } = {}) {

// Physics
const GRAVITY = 32, SPEED = 8, JUMP = 12.5, DOUBLE_JUMP = 10.5, BOUNCE = 24;
const tmp = V();

function collide() {
  const p = state.pos, v = state.vel;
  for (const pl of level.plats) {
    if (!pl.solid) continue;
    const minX = pl.pos.x - pl.w / 2, maxX = pl.pos.x + pl.w / 2;
    const minZ = pl.pos.z - pl.d / 2, maxZ = pl.pos.z + pl.d / 2;
    const top = pl.pos.y, bottom = pl.pos.y - pl.h;
    const cx = THREE.MathUtils.clamp(p.x, minX, maxX);
    const cy = THREE.MathUtils.clamp(p.y, bottom, top);
    const cz = THREE.MathUtils.clamp(p.z, minZ, maxZ);
    const dx = p.x - cx, dy = p.y - cy, dz = p.z - cz;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 >= R * R) continue;
    let nx, ny, nz, pen;
    const d = Math.sqrt(d2);
    if (d > 1e-6) { nx = dx / d; ny = dy / d; nz = dz / d; pen = R - d; }
    else { nx = 0; ny = 1; nz = 0; pen = top - p.y + R; }
    p.x += nx * pen; p.y += ny * pen; p.z += nz * pen;
    const vn = v.x * nx + v.y * ny + v.z * nz;
    if (vn < 0) { v.x -= vn * nx; v.y -= vn * ny; v.z -= vn * nz; }
    if (ny > 0.6) { state.onGround = true; state.groundPlat = pl; }
  }
  // decorations (trees, pillars...) block sideways movement
  for (const pl of level.plats) {
    if (!pl.solid) continue;
    for (const o of pl.obstacles) {
      tmp.set(p.x - (pl.pos.x + o.dx), 0, p.z - (pl.pos.z + o.dz));
      const min = R + o.r, len = tmp.length();
      if (len < min && p.y < pl.pos.y + o.h && p.y > pl.pos.y - 0.1 && len > 1e-6) {
        tmp.multiplyScalar((min - len) / len);
        p.x += tmp.x; p.z += tmp.z;
      }
    }
  }
}

function updatePlatforms(dt, t) {
  for (const pl of level.plats) {
    if (pl.move) {
      tmp.copy(pl.pos);
      pl.pos.copy(pl.base).addScaledVector(pl.move, Math.sin(t * pl.speed));
      pl.delta.subVectors(pl.pos, tmp);
      pl.group.position.copy(pl.pos);
    }
    if (pl.crumble) {
      if (pl.cState === 'shaking') {
        pl.cTimer -= dt;
        pl.group.position.set(pl.pos.x + (Math.random() - 0.5) * 0.14, pl.pos.y, pl.pos.z + (Math.random() - 0.5) * 0.14);
        if (pl.cTimer <= 0) {
          pl.cState = 'falling'; pl.cTimer = 1.2; pl.solid = false; pl.fallV = 0;
          beep(110, 0.3, 'triangle', 0.12, 0.5);
        }
      } else if (pl.cState === 'falling') {
        pl.fallV += 25 * dt;
        pl.group.position.y -= pl.fallV * dt;
        pl.group.rotation.z += dt * 0.6;
        pl.cTimer -= dt;
        if (pl.cTimer <= 0) { pl.cState = 'gone'; pl.cTimer = 2.5; pl.group.visible = false; }
      } else if (pl.cState === 'gone') {
        pl.cTimer -= dt;
        if (pl.cTimer <= 0) {
          pl.cState = 'idle'; pl.solid = true; pl.group.visible = true;
          pl.group.position.copy(pl.pos); pl.group.rotation.z = 0;
        }
      }
    }
    if (pl.pad) pl.pad.scale.lerp(tmp.set(1, 1, 1), Math.min(1, dt * 10));
  }
}

function step(dt, t) {
  updatePlatforms(dt, t);
  if (state.groundPlat && state.groundPlat.move) state.pos.add(state.groundPlat.delta);
  state.fireCd -= dt;

  // input
  if (keys.KeyQ) state.yaw += 2.2 * dt;
  if (keys.KeyE) state.yaw -= 2.2 * dt;
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  let mx = -sy * fwd + cy * side, mz = -cy * fwd - sy * side;
  const ml = Math.hypot(mx, mz);
  if (ml > 0) { mx /= ml; mz /= ml; }
  const onIce = state.onGround && state.groundPlat?.ice;
  const accel = state.onGround ? (onIce ? 1.8 : 14) : state.stomping ? 1 : 5;
  const k = Math.min(1, accel * dt);
  state.vel.x += (mx * SPEED * (onIce ? 1.25 : 1) - state.vel.x) * k;
  state.vel.z += (mz * SPEED * (onIce ? 1.25 : 1) - state.vel.z) * k;

  // jumping
  state.jumpBuffer -= dt;
  if (state.jumpBuffer > 0 && !state.stomping) {
    if (state.onGround || state.coyote > 0) {
      state.vel.y = JUMP; state.jumps = 1; state.coyote = 0; state.jumpBuffer = 0;
      state.groundPlat = null;
      beep(440, 0.12, 'square', 0.06, 1.6);
    } else if (state.jumps < 2) {
      state.vel.y = DOUBLE_JUMP; state.jumps = 2; state.jumpBuffer = 0;
      burst(state.pos.clone().setY(state.pos.y - R), 0xffffff, 8, 3);
      beep(620, 0.12, 'square', 0.06, 1.6);
    }
  }

  state.vel.y = Math.max(state.vel.y - GRAVITY * dt, state.stomping ? -40 : -28);

  // Grounded if ANY substep touched a floor. Resetting this per substep made it
  // depend on float rounding once the ball came to rest on the surface.
  state.onGround = false;
  const SUB = 3;
  for (let i = 0; i < SUB; i++) {
    state.pos.addScaledVector(state.vel, dt / SUB);
    collide();
  }
  if (!state.onGround) state.groundPlat = null;

  if (state.onGround && state.stomping) {
    state.stomping = false;
    shockwave(state.pos);
  }

  const g = state.groundPlat;
  if (state.onGround && g.bounce) {
    state.vel.y = BOUNCE;
    state.jumps = 1;
    state.onGround = false; state.groundPlat = null; state.coyote = 0;
    g.pad.scale.set(1.35, 0.4, 1.35);
    burst(state.pos.clone().setY(g.pos.y), 0xff6ac0, 14, 5);
    beep(260, 0.35, 'sine', 0.18, 3);
  } else if (state.onGround) {
    state.coyote = 0.1;
    if (state.vel.y <= 0) state.jumps = 0;
    if (g.crumble && g.cState === 'idle') { g.cState = 'shaking'; g.cTimer = 0.55; }
    if (!g.move && !g.crumble) state.lastSafe.set(g.pos.x, g.pos.y + 1, g.pos.z);
  } else {
    state.coyote -= dt;
    if (state.jumps === 0 && state.coyote <= 0) state.jumps = 1; // walked off a ledge: only double jump left
  }

  // fell into the void, the lava or the quicksand
  if (state.pos.y < level.killY) {
    const floor = level.theme.floor;
    if (floor) {
      burst(state.pos.clone(), floor === 'lava' ? 0xff7a20 : 0xe0bf80, 24, 7);
      beep(150, 0.4, 'sawtooth', 0.12, 0.3);
    }
    state.stomping = false;
    hurt(null, { fall: true });
    if (state.mode === 'playing') {
      state.pos.copy(state.lastSafe);
      state.vel.set(0, 0, 0);
    }
  }

  // rolling visual
  const hv = Math.hypot(state.vel.x, state.vel.z);
  if (hv > 0.01) {
    tmp.set(state.vel.z, 0, -state.vel.x).normalize();
    player.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(tmp, (hv * dt) / R));
  }

  if (state.invuln > 0) {
    state.invuln -= dt;
    player.visible = state.invuln <= 0 || Math.floor(state.invuln * 12) % 2 === 0;
  }
}

function updateWorld(dt, t) {
  const playing = state.mode === 'playing';

  for (const c of level.crystals) {
    if (c.collected) continue;
    c.mesh.position.set(c.plat.pos.x + c.dx, c.plat.pos.y + 1 + Math.sin(t * 2 + c.phase) * 0.2, c.plat.pos.z + c.dz);
    c.mesh.rotation.y = t * 1.5 + c.phase;
    if (playing && !c.locked && c.mesh.position.distanceTo(state.pos) < 1.2) {
      c.collected = true;
      c.mesh.visible = false;
      state.collected++;
      burst(c.mesh.position, level.theme.crystal[0], 22, 6);
      beep(880, 0.1, 'triangle', 0.15);
      setTimeout(() => beep(1320, 0.15, 'triangle', 0.12), 70);
      if (state.collected === level.crystals.length) levelComplete();
    }
  }

  for (const it of level.items) {
    if (it.taken) continue;
    it.mesh.position.set(it.plat.pos.x + it.dx, it.plat.pos.y + 1.05 + Math.sin(t * 2.5 + it.phase) * 0.15, it.plat.pos.z + it.dz);
    it.obj.rotation.y = t * 2;
    it.beacon.scale.setScalar(1 + Math.sin(t * 4 + it.phase) * 0.12);
    if (playing && it.mesh.position.distanceTo(state.pos) < 1.3) {
      it.taken = true;
      it.mesh.visible = false;
      const def = ITEMS[it.kind];
      def.give();
      burst(it.mesh.position, 0xffffff, 18, 5);
      beep(660, 0.1, 'triangle', 0.15); setTimeout(() => beep(990, 0.2, 'triangle', 0.15), 90);
      showBanner(def.name, def.how, 3000);
      updateHud();
    }
  }

  let boss = null;
  for (const c of level.creatures) {
    if (!c.alive) continue;
    CREATURES[c.type].update(c, dt, t);
    if (c.pulse > 0) { c.pulse -= dt; c.mesh.scale.setScalar(1 + Math.max(0, c.pulse) * 1.5); }
    if (c.boss) boss = c;
    if (!playing) continue;
    const center = c.mesh.position.clone();
    if (c.centerY) center.y += c.centerY * 0.6;
    if (center.distanceTo(state.pos) < R + c.radius) {
      if (state.stomping && state.pos.y > c.mesh.position.y) {
        damageCreature(c, 2);
        state.stomping = false;
        state.vel.y = 12;
        state.jumps = 1;
        shockwave(state.pos);
      } else {
        hurt(c.mesh.position);
      }
    }
  }
  if (boss && playing && boss.mesh.position.distanceTo(state.pos) < 22) {
    bossbar.style.display = 'block';
    bossbar.querySelector('.fill').style.width = `${(boss.hp / boss.maxHp) * 100}%`;
  } else {
    bossbar.style.display = 'none';
  }

  for (const p of projectiles) {
    if (!p.active) continue;
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const pos = p.mesh.position;
    let dead = p.life <= 0 || insideSolid(pos);
    if (!dead && p.owner === 'player') {
      for (const c of level.creatures) {
        if (!c.alive) continue;
        const center = c.mesh.position.clone();
        if (c.centerY) center.y += c.centerY;
        if (center.distanceTo(pos) < c.radius + p.r + 0.2) { damageCreature(c, 1); dead = true; break; }
      }
    } else if (!dead && playing && pos.distanceTo(state.pos) < R + p.r) {
      hurt(pos);
      dead = true;
    }
    if (dead) {
      p.active = false;
      p.mesh.visible = false;
      burst(pos, p.mesh.material.color, 5, 2);
    }
  }

  if (shockT > 0) {
    shockT -= dt;
    const k = 1 - Math.max(0, shockT) / 0.35;
    shockRing.scale.setScalar(0.5 + k * 7);
    shockRing.material.opacity = (1 - k) * 0.8;
    if (shockT <= 0) shockRing.visible = false;
  }

  for (const c of level.clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 100) c.position.x = -100;
  }
  for (const r of level.spinners) {
    r.rotation.x += r.userData.spin * dt;
    r.rotation.y += r.userData.spin * 0.7 * dt;
  }
  for (const d of level.decor) if (d.userData.spin) d.rotation.y += dt * 0.8;

  if (level.lava) {
    const a = level.lava.geometry.attributes.position, base = level.lavaBase;
    for (let i = 0; i < a.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      a.array[i * 3 + 2] = Math.sin(x * 0.12 + t * 1.2) * 0.35 + Math.cos(y * 0.15 + t * 0.8) * 0.35;
    }
    a.needsUpdate = true;
    level.lava.material.emissiveIntensity = 0.5 + Math.sin(t * 2) * 0.12;
  }

  if (level.lightning) {
    const L = level.lightning;
    L.timer -= dt;
    if (L.timer <= 0) {
      L.timer = 4 + Math.random() * 6;
      L.flash = 0.35;
      setTimeout(() => beep(55, 1.4, 'sawtooth', 0.12, 0.5), 300 + Math.random() * 500);
    }
    L.flash -= dt;
    const on = L.flash > 0 && Math.sin(L.flash * 60) > 0;
    hemi.intensity = level.theme.hemi[2] + (on ? 2.5 : 0);
  }

  if (level.ambient) updateAmbient(level.ambient, dt, t);

  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vel.y -= 12 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = Math.max(0, p.life);
    p.mesh.rotation.x += dt * 8;
    if (p.life <= 0) p.mesh.visible = false;
  }
}

function updateCamera(dt) {
  const dist = 9;
  const target = state.pos.clone().add(V(0, 1, 0));
  const desired = V(
    Math.sin(state.yaw) * Math.cos(state.pitch) * dist,
    Math.sin(state.pitch) * dist,
    Math.cos(state.yaw) * Math.cos(state.pitch) * dist
  ).add(target);
  if (snapCamera) { camera.position.copy(desired); snapCamera = false; }
  else camera.position.lerp(desired, 1 - Math.exp(-12 * dt));
  camera.lookAt(target);

  sun.position.copy(state.pos).add(V(6, 25, 4));
  sun.target.position.copy(state.pos);
  sky.position.copy(camera.position);
}

// Main loop
const clock = new THREE.Clock();
loadLevel(0);
showTitle();

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (state.mode === 'playing') {
    worldTime += dt;
    state.time += dt;
    step(dt, worldTime);
    updateHud();
  } else if (state.mode === 'title') {
    worldTime += dt;
    updatePlatforms(dt, worldTime);
    state.yaw += dt * 0.15; // slow orbit on the title screen
  }
  if (state.mode !== 'paused') updateWorld(dt, worldTime);
  player.position.copy(state.pos);
  shieldBubble.position.copy(state.pos);
  shieldBubble.visible = state.shield && player.visible;
  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
